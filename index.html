<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShopEase</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🛒 ShopEase</h1><input type="text" id="search" placeholder="Search products..."><button id="cartBtn">Cart (<span id="cartCount">0</span>)</button></header>
<main><div id="products" class="products"></div></main>
<div id="cartModal" class="modal"><div class="modal-content"><span id="close">&times;</span><h2>Shopping Cart</h2><ul id="cartItems"></ul><h3>Total: ₹<span id="total">0</span></h3></div></div>
<script src="script.js"></script></body></html>
